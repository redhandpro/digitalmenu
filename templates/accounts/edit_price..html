{% extends 'base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>✏️ ویرایش قیمت {{ product.name }}</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">قیمت جدید (تومان)</label>
            <input type="number" name="price" class="form-control" value="{{ product.price }}" step="0.01" required>
        </div>
        <button type="submit" class="btn btn-primary">💾 ذخیره</button>
        <a href="{% url 'manage_products' %}" class="btn btn-secondary">بازگشت</a>
    </form>
</div>
{% endblock %}
