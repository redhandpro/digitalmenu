<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>QR کد {{ business.name }}</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Vazirmatn', Tahoma, sans-serif;
    background: linear-gradient(135deg, #f7f1e8 0%, #e8dccb 100%);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: #3d2b1f;
  }
  .qr-card {
    background: #fffaf3;
    border-radius: 24px;
    padding: 40px 30px;
    text-align: center;
    max-width: 420px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(92, 60, 30, 0.15);
    border: 1px solid rgba(200, 170, 130, 0.3);
  }
  .qr-card h1 {
    font-size: 22px;
    color: #6b4423;
    margin-bottom: 8px;
  }
  .qr-card p {
    font-size: 13px;
    color: #a08868;
    margin-bottom: 20px;
  }
  .qr-image-wrapper {
    background: #fff;
    padding: 20px;
    border-radius: 16px;
    display: inline-block;
    border: 2px dashed #d9c4a9;
    margin-bottom: 20px;
  }
  .qr-image-wrapper img {
    display: block;
    width: 220px;
    height: 220px;
  }
  .menu-link {
    background: #f7ecdd;
    color: #8b5a2b;
    padding: 10px 16px;
    border-radius: 12px;
    font-size: 12px;
    word-break: break-all;
    margin-bottom: 16px;
    font-family: monospace;
    direction: ltr;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 24px;
    background: #8b5a2b;
    color: #fff;
    border: none;
    border-radius: 12px;
    font-family: 'Vazirmatn', sans-serif;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s;
    text-decoration: none;
    margin: 4px;
  }
  .btn:hover {
    background: #6b4423;
    transform: translateY(-2px);
  }
  .btn-secondary {
    background: #d9c4a9;
    color: #4a3423;
  }
  .btn-secondary:hover {
    background: #b8a086;
  }
  @media print {
    body { background: #fff; }
    .qr-card { box-shadow: none; border: none; }
    .btn, .menu-link { display: none; }
  }
</style>
</head>
<body>

<div class="qr-card">
  <h1>☕ {{ business.name }}</h1>
  <p>برای مشاهده منو، اسکن کنید</p>
  
  <div class="qr-image-wrapper">
    <img src="/qr-image/{{ business.slug }}/" alt="QR Code">
  </div>
  
  <div class="menu-link">{{ menu_url }}</div>
  
  <button class="btn" onclick="window.print()">
    🖨️ چاپ QR کد
  </button>
  <a href="/accounts/dashboard/" class="btn btn-secondary">
    ← بازگشت
  </a>
</div>

</body>
</html>
